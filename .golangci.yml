# golangci-lint configuration (v2 schema).
#
# Philosophy: enable broadly, disable deliberately with a comment giving the
# reason. A disabled linter with no justification is a bug in this file.
#
# The high-value section is `depguard` and `forbidigo` below: generic Go
# hygiene is table stakes, but those two enforce this SDK's architectural
# invariants.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # --- correctness ---
    - asasalint
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - exhaustive
    - fatcontext
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - noctx
    - recvcheck
    - staticcheck
    - unused
    # --- error handling ---
    - errorlint
    - wrapcheck
    # --- style and maintainability ---
    - gocritic
    - goconst
    - godot
    - misspell
    - mnd
    - nakedret
    - perfsprint
    - prealloc
    - revive
    - tagalign
    - musttag
    - unconvert
    - unparam
    - usestdlibvars
    - wsl_v5
    # --- complexity budgets ---
    - cyclop
    - dupl
    - funlen
    - gocognit
    - nestif
    # --- tests ---
    - paralleltest
    - thelper
    - tparallel
    # --- security and project invariants ---
    - depguard
    - forbidigo
    - gochecknoglobals
    - gosec
    - nolintlint

  # Excluded by design:
  #   lll          — golines handles line length in `task fmt` instead.
  #   varnamelen   — fights idiomatic Go (i, w, b, r).
  #   ireturn      — the observer and pager interfaces are deliberate.
  #   testifylint  — tests are stdlib-only; there is no testify to lint.

  settings:
    depguard:
      rules:
        # Boomi component XML is opaque bytes by design: the SDK moves it,
        # never interprets it. Typed unmarshalling breaks the day Boomi adds
        # a field, and a lossy round-trip corrupts customer components. Two
        # exceptions: internal/query may build XML QueryConfig payloads for
        # the platform's query API, and componentxml is the deliberate,
        # contained struct view of the component ENVELOPE (the inner object
        # stays verbatim bytes even there — see that package's doc).
        component-xml-is-opaque:
          files:
            - "!**/internal/query/**"
            - "!**/componentxml/**"
          deny:
            - pkg: encoding/xml
              desc: >-
                component XML is opaque bytes — the SDK transports it and
                never interprets it. Only internal/query may build XML
                (QueryConfig payloads).

    # This SDK never prints: callers observe progress through the observer
    # interface and own their process's streams. A stray Print in a library
    # corrupts output the consumer controls.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: the SDK never prints — report through the observer interface
        - pattern: ^print(ln)?$
          msg: the SDK never prints — report through the observer interface
        - pattern: ^os\.Stdout$
          msg: the SDK never touches process streams — the consumer owns them
        - pattern: ^os\.Stderr$
          msg: the SDK never touches process streams — the consumer owns them

    exhaustive:
      default-signifies-exhaustive: false
      check:
        # Switches only. A map keyed by an enum is often a deliberate subset
        # (a test fixture, a lookup table), and requiring every key there
        # produces noise without protecting anything.
        - switch

    govet:
      enable-all: true
      disable:
        # Exported structs are read in documentation order by consumers.
        # Reordering fields to save padding would trade legibility for bytes
        # that do not matter at this scale.
        - fieldalignment
      settings:
        shadow:
          strict: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        # ctx.Err() is conventionally returned unwrapped: callers test it
        # with errors.Is(err, context.Canceled/DeadlineExceeded), and a
        # cancellation needs no extra context about where it was noticed.
        - (context.Context).Err(
      # Errors crossing package boundaries inside this module already carry
      # their context (*APIError, pace sentinels, "boomi: METHOD path"
      # prefixes); wrapping them again at every internal boundary would
      # stack redundant prefixes onto every message.
      ignore-package-globs:
        - github.com/aaron-au/boomi-sdk*

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Conflicts with wsl_v5's cuddling rules on early returns.
        - ifElseChain
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: var-naming
        - name: context-as-argument
        - name: unexported-return
        - name: unreachable-code
        - name: redefines-builtin-id

    # No rule exclusions. G104 overlaps errcheck, but the overlap is not
    # total, and it stays on until it actually produces noise worth arguing
    # about.
    gosec: {}

    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 40
    nestif:
      min-complexity: 4
    dupl:
      threshold: 150

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    # No locale is set: prose in this repo is British, identifiers follow Go
    # and platform convention. Enforcing either locale would fight the other.
    misspell: {}

  exclusions:
    generated: lax
    rules:
      # The tools module holds developer utilities, not the shipped library,
      # and is not bound by the never-prints invariant.
      - path: tools/
        linters:
          - forbidigo

      # Tests cannot run parallel by design: pace tests swap the
      # package-level clock seams (now/sleepCtx/randFloat), and client and
      # objects tests exercise the process-global limiter and breaker
      # registries — per-account pacing state deliberately outlives any one
      # client, so parallel tests would race on it.
      - path: _test\.go
        linters:
          - paralleltest

      # Tests may print, duplicate setup, use magic numbers freely, and
      # spend their complexity budget on table-driven fake servers.
      - path: _test\.go
        linters:
          - forbidigo
          - dupl
          - funlen
          - goconst
          - gochecknoglobals
          - mnd
          - wrapcheck
          - gocognit
          - cyclop

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/aaron-au/boomi-sdk)
        - blank
        - dot
      custom-order: true
    gofumpt:
      extra-rules: true
    golines:
      max-len: 120
      tab-len: 4

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
